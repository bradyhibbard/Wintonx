name: Release on master (WPF + Inno Setup + NetSparkle appcast)

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    env:
      WORKSPACE: ${{ github.workspace }}
      APP_NAME: Wintonx
      # IMPORTANT: must match your actual exe name in /publish (see csproj)
      APP_EXE_NAME: Winton.exe
      PUBLISH_DIR: ${{ github.workspace }}/publish
      INSTALLER_DIR: ${{ github.workspace }}/installer_out
      ISS_PATH: ${{ github.workspace }}/installer/Wintonx.ci.iss

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Dotnet info (diagnostic)
        run: dotnet --info

      - name: Find .csproj
        id: findproj
        shell: pwsh
        run: |
          $proj = Get-ChildItem -Recurse -Filter *.csproj | Select-Object -First 1
          if (-not $proj) { throw "No .csproj found" }
          "path=$($proj.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "Using project: $($proj.FullName)"

      - name: Get version from csproj
        id: getver
        shell: pwsh
        run: |
          [xml]$xml = Get-Content "${{ steps.findproj.outputs.path }}"
          $ver = ($xml.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -Last 1).Version
          if (-not $ver) { throw "No <Version> found in csproj" }
          "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Detected version: $ver"

      - name: Restore
        run: dotnet restore "${{ steps.findproj.outputs.path }}"

      - name: Publish (Release to /publish)
        run: dotnet publish "${{ steps.findproj.outputs.path }}" -c Release -o "${{ env.PUBLISH_DIR }}"

      - name: List repo + publish output (diagnostic)
        shell: pwsh
        run: |
          Write-Host "Workspace: $env:WORKSPACE"
          Get-ChildItem $env:WORKSPACE
          if (-not (Test-Path "$env:PUBLISH_DIR")) { throw "Publish dir missing: $env:PUBLISH_DIR" }
          Write-Host "`nPublish tree:"
          Get-ChildItem -Recurse "$env:PUBLISH_DIR"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          $ws      = $env:GITHUB_WORKSPACE
          $iss     = Join-Path $ws 'installer\Wintonx.ci.iss'
          $publish = Join-Path $ws 'publish'
          $out     = Join-Path $ws 'installer_out'

          Write-Host "ISS expected at: $iss"
          if (-not (Test-Path $iss)) { throw "Missing ISS script: $iss" }

          New-Item -ItemType Directory -Force -Path $out | Out-Null

          # Robust ISCC discovery
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $cmd = Get-Command iscc.exe -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }
          if (-not $iscc) {
            Write-Host "Tried:" ($candidates -join " | ")
            throw "ISCC.exe not found on runner"
          }
          Write-Host "Using ISCC at: $iscc"

          Write-Host "PublishDir => $publish"
          Write-Host "OutDir     => $out"
          Write-Host "App EXE    => $env:APP_EXE_NAME"

          & $iscc `
            /DMyAppName=${{ env.APP_NAME }} `
            /DMyAppVersion=${{ steps.getver.outputs.version }} `
            /DMyPublishDir=$publish `
            /DMyOutputDir=$out `
            /DMyAppExeName=$env:APP_EXE_NAME `
            $iss

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Write-Host "Installer output:"
          Get-ChildItem -Recurse $out

      - name: Create appcast.xml (NetSparkle)
        shell: pwsh
        run: |
          $version = "${{ steps.getver.outputs.version }}"
          $ws = $env:GITHUB_WORKSPACE
          $outDir = Join-Path $ws 'installer_out'
          if (-not (Test-Path $outDir)) { throw "Missing installer_out: $outDir" }

          # Prefer a name like Wintonx-Setup-<ver>.exe, else first .exe
          $installer = Get-ChildItem $outDir -Filter '*-Setup-*.exe' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) { $installer = Get-ChildItem $outDir -Filter *.exe | Select-Object -First 1 }
          if (-not $installer) { throw "Installer .exe not found in $outDir" }

          $assetName = $installer.Name
          $length = (Get-Item $installer.FullName).Length
          $repo = "${{ github.repository }}"

          $xml = @"
            <?xml version="1.0" encoding="utf-8"?>
            <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
              <channel>
                <title>${{ env.APP_NAME }} Updates</title>
                <link>https://github.com/$repo</link>
                <description>Release feed for ${{ env.APP_NAME }}</description>
                <item>
                  <title>$version</title>
                  <sparkle:releaseNotesLink>https://github.com/$repo/releases/tag/v$version</sparkle:releaseNotesLink>
                  <enclosure url="https://github.com/$repo/releases/download/v$version/$assetName"
                             sparkle:version="$version"
                             length="$length"
                             type="application/octet-stream" />
                </item>
              </channel>
            </rss>
            "@
          $appcastPath = Join-Path $outDir 'appcast.xml'
          $xml | Out-File -FilePath $appcastPath -Encoding utf8
          Write-Host "Created: $appcastPath"

      - name: Create tag (vX.Y.Z)
        id: tag
        shell: pwsh
        run: |
          $tag = "v${{ steps.getver.outputs.version }}"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git fetch --tags
          if (-not (git tag --list $tag)) {
            git tag $tag
            git push origin $tag
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Tag ready: $tag"

      - name: Create GitHub Release (upload installer + appcast)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            ${{ env.INSTALLER_DIR }}/*.exe
            ${{ env.INSTALLER_DIR }}/appcast.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # OPTIONAL: code signing example (requires cert + secret password)
      # - name: Sign installer (optional)
      #   if: env.CODESIGN_PFX != ''
      #   shell: pwsh
      #   run: |
      #     $pfx = "$env:GITHUB_WORKSPACE\certs\codesign.pfx"
      #     $inst = Get-ChildItem "$env:INSTALLER_DIR" -Filter *.exe | Select-Object -First 1
      #     if ($inst) {
      #       & "C:\Program Files (x86)\Windows Kits\10\bin\x64\signtool.exe" sign `
      #         /f $pfx /p "${{ secrets.CODESIGN_PFX_PASSWORD }}" `
      #         /tr http://timestamp.digicert.com /td SHA256 /fd SHA256 `
      #         $inst.FullName
      #     }
