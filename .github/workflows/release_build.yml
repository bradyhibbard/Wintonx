name: Release on master (auto-bump patch + Inno + NetSparkle)

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: windows-latest

    env:
      WORKSPACE: ${{ github.workspace }}
      APP_NAME: Wintonx
      # Must match your built exe in /publish
      APP_EXE_NAME: Winton.exe
      PUBLISH_DIR: ${{ github.workspace }}/publish
      INSTALLER_DIR: ${{ github.workspace }}/installer_out
      ISS_PATH: ${{ github.workspace }}/installer/Wintonx.ci.iss

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # we need tags

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Determine next version (auto-bump PATCH)
        id: semver
        shell: pwsh
        run: |
          git fetch --tags --force
          $tags = git tag --list "v*" | ForEach-Object { $_.Trim() } |
                  Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } |
                  Sort-Object { [version]($_.TrimStart('v')) } -Descending
          if ($tags.Count -gt 0) {
            $latest = $tags[0].TrimStart('v')
            $v = [version]$latest
            $next = [version]::new($v.Major, $v.Minor, $v.Build + 1)
          } else {
            $next = [version]"1.0.0"
          }
          $fileVer = "$($next.Major).$($next.Minor).$($next.Build).0"
          "version=$next"     >> $env:GITHUB_OUTPUT
          "fileversion=$fileVer" >> $env:GITHUB_OUTPUT
          Write-Host "Latest tag: $($tags[0])  -> Next: v$next"

      - name: Find .csproj
        id: findproj
        shell: pwsh
        run: |
          $proj = Get-ChildItem -Recurse -Filter *.csproj | Select-Object -First 1
          if (-not $proj) { throw "No .csproj found" }
          "path=$($proj.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "Using project: $($proj.FullName)"

      - name: Restore
        run: dotnet restore "${{ steps.findproj.outputs.path }}"

      - name: Publish (Release to /publish) with version override
        run: >
          dotnet publish "${{ steps.findproj.outputs.path }}"
          -c Release -o "${{ env.PUBLISH_DIR }}"
          -p:Version=${{ steps.semver.outputs.version }}
          -p:AssemblyVersion=${{ steps.semver.outputs.fileversion }}
          -p:FileVersion=${{ steps.semver.outputs.fileversion }}

      - name: List publish output (diagnostic)
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:PUBLISH_DIR")) { throw "Publish dir missing: $env:PUBLISH_DIR" }
          Get-ChildItem -Recurse "$env:PUBLISH_DIR"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          $ws      = $env:GITHUB_WORKSPACE
          $iss     = Join-Path $ws 'installer\Wintonx.ci.iss'
          $publish = Join-Path $ws 'publish'
          $out     = Join-Path $ws 'installer_out'

          if (-not (Test-Path $iss)) { throw "Missing ISS script: $iss" }
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $cmd = Get-Command iscc.exe -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }
          if (-not $iscc) { throw "ISCC.exe not found on runner" }

          & $iscc `
            /DMyAppName=${{ env.APP_NAME }} `
            /DMyAppVersion=${{ steps.semver.outputs.version }} `
            /DMyPublishDir=$publish `
            /DMyOutputDir=$out `
            /DMyAppExeName=$env:APP_EXE_NAME `
            $iss

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem -Recurse $out

      - name: Create appcast.xml (NetSparkle)
        shell: pwsh
        run: |
          $version = "${{ steps.semver.outputs.version }}"
          $ws = $env:GITHUB_WORKSPACE
          $outDir = Join-Path $ws 'installer_out'
          if (-not (Test-Path $outDir)) { throw "Missing installer_out: $outDir" }

          $installer = Get-ChildItem $outDir -Filter '*-Setup-*.exe' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) { $installer = Get-ChildItem $outDir -Filter *.exe | Select-Object -First 1 }
          if (-not $installer) { throw "Installer .exe not found in $outDir" }

          $assetName = $installer.Name
          $length = (Get-Item $installer.FullName).Length
          $repo = "${{ github.repository }}"
          $appcastPath = Join-Path $outDir 'appcast.xml'

          $lines = @()
          $lines += '<?xml version="1.0" encoding="utf-8"?>'
          $lines += '<rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">'
          $lines += '  <channel>'
          $lines += "    <title>$($env:APP_NAME) Updates</title>"
          $lines += "    <link>https://github.com/$repo</link>"
          $lines += "    <description>Release feed for $($env:APP_NAME)</description>"
          $lines += '    <item>'
          $lines += "      <title>$version</title>"
          $lines += "      <sparkle:releaseNotesLink>https://github.com/$repo/releases/tag/v$version</sparkle:releaseNotesLink>"
          $enclosure = "      <enclosure url=""https://github.com/$repo/releases/download/v$version/$assetName"" sparkle:version=""$version"" length=""$length"" type=""application/octet-stream"" />"
          $lines += $enclosure
          $lines += '    </item>'
          $lines += '  </channel>'
          $lines += '</rss>'

          Set-Content -Path $appcastPath -Value $lines -Encoding utf8
          Write-Host "Created: $appcastPath"
          Get-Content $appcastPath

      - name: Create tag vX.Y.Z
        id: tag
        shell: pwsh
        run: |
          $tag = "v${{ steps.semver.outputs.version }}"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git fetch --tags
          if (-not (git tag --list $tag)) {
            git tag $tag
            git push origin $tag
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Tag ready: $tag"

      - name: Create GitHub Release (upload installer + appcast)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            ${{ env.INSTALLER_DIR }}/*.exe
            ${{ env.INSTALLER_DIR }}/appcast.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
