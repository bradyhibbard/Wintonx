name: Release on master (WPF + Inno Setup)

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    env:
      WORKSPACE: ${{ github.workspace }}
      # Display/installer product name (menus, installer name)
      APP_NAME: Wintonx
      # Actual exe produced by dotnet publish (project name is "Winton")
      APP_EXE_NAME: Winton.exe
      # Absolute paths to avoid working-dir ambiguity
      PUBLISH_DIR: ${{ github.workspace }}/publish
      INSTALLER_DIR: ${{ github.workspace }}/installer_out
      ISS_PATH: ${{ github.workspace }}/installer/Wintonx.ci.iss

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Dotnet info (diagnostic)
        run: dotnet --info

      - name: Find .csproj
        id: findproj
        shell: pwsh
        run: |
          $proj = Get-ChildItem -Recurse -Filter *.csproj | Select-Object -First 1
          if (-not $proj) { throw "No .csproj found" }
          "path=$($proj.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "Using project: $($proj.FullName)"

      - name: Get version from csproj
        id: getver
        shell: pwsh
        run: |
          [xml]$xml = Get-Content "${{ steps.findproj.outputs.path }}"
          $ver = ($xml.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -Last 1).Version
          if (-not $ver) { throw "No <Version> found in csproj" }
          "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Detected version: $ver"

      - name: Restore
        run: dotnet restore "${{ steps.findproj.outputs.path }}"

      - name: Publish (Release to /publish)
        run: dotnet publish "${{ steps.findproj.outputs.path }}" -c Release -o "${{ env.PUBLISH_DIR }}"

      - name: List repo + publish output (diagnostic)
        shell: pwsh
        run: |
          Write-Host "Workspace: $env:WORKSPACE"
          Write-Host "Top-level repo contents:"; Get-ChildItem $env:WORKSPACE
          if (-not (Test-Path "$env:PUBLISH_DIR")) { throw "Publish dir missing: $env:PUBLISH_DIR" }
          Write-Host "`nPublish tree:"; Get-ChildItem -Recurse "$env:PUBLISH_DIR"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          Write-Host "ISS expected at: $env:ISS_PATH"
          if (-not (Test-Path "$env:ISS_PATH")) {
            Get-ChildItem -Recurse -Force "$env:WORKSPACE" | Select-Object FullName
            throw "Missing ISS script: $env:ISS_PATH"
          }

          New-Item -ItemType Directory -Force -Path "$env:INSTALLER_DIR" | Out-Null

          $iscc = "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }

          $PublishDir = [System.IO.Path]::GetFullPath($env:PUBLISH_DIR)
          $OutDir     = [System.IO.Path]::GetFullPath($env:INSTALLER_DIR)
          Write-Host "PublishDir => $PublishDir"
          Write-Host "OutDir     => $OutDir"
          Write-Host "App EXE    => $env:APP_EXE_NAME"

          - name: Debug: prove the .iss exists
          shell: pwsh
          run: |
            Write-Host "Workspace: $env:GITHUB_WORKSPACE"
            Write-Host "`nTop-level:"
            Get-ChildItem $env:GITHUB_WORKSPACE
            Write-Host "`nAny .iss files in workspace:"
            Get-ChildItem -Recurse -Force $env:GITHUB_WORKSPACE -Filter *.iss | Select-Object FullName
            if (-not (Test-Path "$env:GITHUB_WORKSPACE\installer\Wintonx.ci.iss")) {
              throw "CI cannot see installer\Wintonx.ci.iss"
            }

          & "$iscc" `
            /DMyAppName=$env:APP_NAME `
            /DMyAppVersion=${{ steps.getver.outputs.version }} `
            /DMyPublishDir=$PublishDir `
            /DMyOutputDir=$OutDir `
            /DMyAppExeName=Winton.exe `
            "$env:ISS_PATH"

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Write-Host "Installer output:"
          Get-ChildItem -Recurse "$env:INSTALLER_DIR"

      - name: Create tag (vX.Y.Z)
        id: tag
        shell: pwsh
        run: |
          $tag = "v${{ steps.getver.outputs.version }}"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git fetch --tags
          if (-not (git tag --list $tag)) {
            git tag $tag
            git push origin $tag
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: ${{ env.INSTALLER_DIR }}/*.exe   # use forward slashes; no quotes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
