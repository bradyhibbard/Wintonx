name: Build and test on pull requests

on:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build Winton.csproj -c Release
      - run: dotnet test tests/Wintonx.Tests/Wintonx.Tests.csproj -c Release --logger "console;verbosity=normal"
