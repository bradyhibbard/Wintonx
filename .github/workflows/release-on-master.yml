name: Release on master (WPF + Inno Setup)

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build-release:
    runs-on: windows-latest

    env:
      APP_NAME: Wintonx
      PUBLISH_DIR: ./publish
      INSTALLER_DIR: ./installer_out
      ISS_PATH: ./installer/Wintonx.ci.iss

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Find .csproj
        id: findproj
        shell: pwsh
        run: |
          $proj = Get-ChildItem -Recurse -Filter *.csproj | Select-Object -First 1
          if (-not $proj) { Write-Error "No .csproj found" }
          echo "path=$($proj.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "Using project: $($proj.FullName)"

      - name: Get version from csproj
        id: getver
        shell: pwsh
        run: |
          [xml]$xml = Get-Content "${{ steps.findproj.outputs.path }}"
          $ver = ($xml.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -Last 1).Version
          if (-not $ver) { Write-Error "No <Version> found in csproj" }
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Detected version: $ver"

      - name: Restore
        run: dotnet restore "${{ steps.findproj.outputs.path }}"

      - name: Publish (Release)
        run: dotnet publish "${{ steps.findproj.outputs.path }}" -c Release -o "${{ env.PUBLISH_DIR }}"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ env.INSTALLER_DIR }}" | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & "$iscc" `
            "/DMyAppName=${{ env.APP_NAME }}" `
            "/DMyAppVersion=${{ steps.getver.outputs.version }}" `
            "/DMyPublishDir=$(Resolve-Path '${{ env.PUBLISH_DIR }}')" `
            "/DMyOutputDir=$(Resolve-Path '${{ env.INSTALLER_DIR }}')" `
            "${{ env.ISS_PATH }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create tag (vX.Y.Z)
        id: tag
        shell: pwsh
        run: |
          $tag = "v${{ steps.getver.outputs.version }}"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git fetch --tags
          if (-not (git tag --list $tag)) {
            git tag $tag
            git push origin $tag
          }
          echo "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: "${{ env.INSTALLER_DIR }}/${{ env.APP_NAME }}-Setup-${{ steps.getver.outputs.version }}.exe"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}